apiVersion: apps/v1
kind: Deployment
metadata:
  name: formular-showcase
  labels:
    app: formular-showcase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: formular-showcase
  template:
    metadata:
      labels:
        app: formular-showcase
    spec:
      containers:
        - name: formular-showcase
          image: formular-showcase:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: NODE_ENV
              value: "production"
